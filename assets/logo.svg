<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Paper background -->
  <rect x="10" y="10" width="100" height="100" rx="4" fill="#fefcf8" stroke="#c5bdb0" stroke-width="2"/>
  
  <!-- Quadrant lines -->
  <line x1="60" y1="20" x2="60" y2="100" stroke="#c5bdb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="20" y1="60" x2="100" y2="60" stroke="#c5bdb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <!-- Quadrant icons -->
  <!-- Brain - top left -->
  <text x="35" y="44" text-anchor="middle" font-size="20">🧠</text>
  
  <!-- Hourglass - top right -->
  <text x="80" y="44" text-anchor="middle" font-size="20">⏳</text>
  
  <!-- Target - bottom left -->
  <text x="35" y="84" text-anchor="middle" font-size="20">🎯</text>
  
  <!-- Lightbulb - bottom right -->
  <text x="80" y="84" text-anchor="middle" font-size="20">💡</text>
  
  <!-- Fold shadow -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#e8e4dd" stroke-width="0.5"/>
  <line x1="10" y1="60" x2="110" y2="60" stroke="#e8e4dd" stroke-width="0.5"/>
</svg>
