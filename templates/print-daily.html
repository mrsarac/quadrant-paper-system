<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Paper Template — Quadrant Paper System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap');
  @page { margin: 1cm; size: A4; }
  body { margin: 0; font-family: 'Caveat', cursive; color: #333; }
  .page {
    width: 190mm; height: 277mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    border: 1px solid #ccc;
    position: relative;
  }
  .page::before {
    content: ''; position: absolute;
    top: 50%; left: 2%; right: 2%;
    border-top: 1px dashed #bbb;
  }
  .page::after {
    content: ''; position: absolute;
    left: 50%; top: 2%; bottom: 2%;
    border-left: 1px dashed #bbb;
  }
  .q { padding: 12mm 8mm; position: relative; z-index: 1; }
  .q h2 { font-size: 18pt; margin: 0 0 6mm; color: #555; }
  .q .lines { margin-top: 4mm; }
  .q .line {
    border-bottom: 1px solid #e5e5e5;
    height: 9mm;
    display: flex;
    align-items: flex-end;
    padding-bottom: 1mm;
    color: #ccc;
    font-size: 10pt;
  }
  .q .line.bullet::before { content: '•  '; }
  .q .line.check::before { content: '☐  '; }
  .corner {
    position: absolute; top: 4mm; right: 6mm;
    font-size: 10pt; color: #bbb;
  }
  .footer-tag {
    position: absolute; bottom: 3mm; right: 6mm;
    font-size: 8pt; color: #ddd;
  }
  .legend {
    position: absolute; bottom: 3mm; left: 6mm;
    font-size: 7pt; color: #ccc;
  }
</style>
</head>
<body>
<div class="page">
  <span class="corner">____.____ D#____</span>
  <span class="footer-tag">quadrant-paper-system</span>
  <span class="legend">☐ to do · ☑ done · → tomorrow · ✕ cancel · ⭕ urgent</span>
  
  <div class="q">
    <h2>☐ Today</h2>
    <div class="lines">
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
    </div>
  </div>
  
  <div class="q">
    <h2>✏️ Notes</h2>
    <div class="lines">
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
    </div>
  </div>
  
  <div class="q">
    <h2>📞 Communication</h2>
    <div class="lines">
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
      <div class="line check"></div>
    </div>
  </div>
  
  <div class="q">
    <h2>🔥 Learned Today</h2>
    <div class="lines">
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
      <div class="line bullet"></div>
    </div>
  </div>
</div>
</body>
</html>
